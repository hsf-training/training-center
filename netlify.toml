# Netlify deploy previews for pull requests
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # The Gatsby plugin is still installed in the Netlify UI from when the
  # site used Gatsby, and fails the build if it runs
  NETLIFY_SKIP_GATSBY_BUILD_PLUGIN = "true"

# The site is built to be served under /training-center/, as on GitHub Pages
[[redirects]]
  from = "/training-center/*"
  to = "/:splat"
  status = 200
